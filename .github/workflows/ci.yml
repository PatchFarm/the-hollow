name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Smoke test the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js plan --cwd test/fixtures/python-fastapi
          node dist/cli.js plan --json --cwd test/fixtures/node-next-prisma > /dev/null

  # One stable check name for branch protection, whatever the matrix looks like.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail unless every test job succeeded
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test jobs: $RESULT"
          test "$RESULT" = "success"
