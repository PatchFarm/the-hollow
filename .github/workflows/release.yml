name: Release

on:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

# Releases run one at a time and are never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release pull request open from the Conventional Commits on main. Merging it tags the
  # version and creates the GitHub release. It uses the RELEASE_PLEASE_TOKEN secret, so CI runs on
  # the release pull request (main requires it); without the secret it falls back to the workflow
  # token, and the release pull request then needs closing and reopening to run CI.
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes the tagged version to npm through trusted publishing: npm trusts this workflow's
  # OIDC token, in the npm environment, so no npm token is stored anywhere, and npm attaches
  # provenance that links the package to this commit and run.
  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/the-hollow
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing
        run: |
          version="$(npm --version)"
          if [ "$(printf '%s\n%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error title=npm too old::Trusted publishing needs npm 11.5.1 or later; this runner has $version."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish
        run: npm publish --access public
