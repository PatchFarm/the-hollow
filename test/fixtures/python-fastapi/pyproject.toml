[project]
name = "fixture-fastapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "SQLAlchemy>=2.1",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
]

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17", "mypy>=2.4", "httpx>=0.28"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
