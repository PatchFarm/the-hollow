# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# A Vercel Preview deploy for each pull request from a branch in this repo, using Preview's environment variables.

name: Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

# A new push replaces the preview that was still building.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview deploy
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the Vercel CLI 65.9.0
        env:
          URL: https://registry.npmjs.org/vercel/-/vercel-65.9.0.tgz
          SHA512: b913a31fe06964fd7c0d74ebba197825356f65b4593c81bcf6014df3167957ae962caebad1073edeb213013206f36ff2ac49b77771a96066af212739da4067ff
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/vercel.tgz" "$URL"
          echo "$SHA512  $RUNNER_TEMP/vercel.tgz" | sha512sum --check --strict
          npm install --global --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/vercel.tgz"
      - name: Pull the preview settings from Vercel
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=Missing secret::Add a Vercel token as the VERCEL_TOKEN secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error title=Missing variables::Add the VERCEL_ORG_ID and VERCEL_PROJECT_ID variables (the orgId and projectId from .vercel/project.json after \`vercel link\`)."
            exit 1
          fi
          vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
      - name: Build with preview settings
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build
      - name: Deploy
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prebuilt --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/deploy.out"
          host="$(grep -Eo '[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.vercel\.app' "$RUNNER_TEMP/deploy.out" | head -n 1 || true)"
          if [ -z "$host" ]; then
            echo "::error title=Deploy::Could not find the deployment URL in the Vercel CLI output:"
            cat "$RUNNER_TEMP/deploy.out"
            exit 1
          fi
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: https://$host" >> "$GITHUB_STEP_SUMMARY"
      - name: Post the preview URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          MARKER: <!-- hollow-preview -->
        run: |
          body="$(printf '%s\n\nPreview of %s: %s' "$MARKER" "$SHA" "$URL")"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
