# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# Weekly grouped updates. Each release waits 7 days before Dependabot proposes it.
# .github/workflows/ci.yml is excluded: its pins change through `hollow upgrade`.

version: 2

updates:
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      uv:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ci
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    exclude-paths:
      - .github/workflows/ci.yml
  - package-ecosystem: docker
    directory: /
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
