# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# Every merge deploys to staging. Merging the release pull request promotes that same image to production.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release to deploy to production, for example v1.4.0. Running this is the approval.
        required: true
        type: string

permissions: {}

jobs:
  # Uses the RELEASE_PLEASE_TOKEN secret when set, so release pull requests run CI; otherwise the workflow token.
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: python
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
    if: ${{ github.event_name == 'push' }}

  # Every merge builds the image once. Every environment runs this exact digest.
  build:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image
        id: image
        env:
          DOCKERFILE: Dockerfile
          IMAGE_NAME: ""
        run: |
          name="$IMAGE_NAME"
          if [ -z "$name" ]; then name="$GITHUB_REPOSITORY"; fi
          image="ghcr.io/$(echo "$name" | tr '[:upper:]' '[:lower:]')"
          docker build --file "$DOCKERFILE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" .
          docker push "$image:sha-$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:sha-$GITHUB_SHA" | cut -d@ -f2)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Built $image@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Syft 1.55.0
        env:
          URL: https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/syft.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" --directory "$RUNNER_TEMP" syft
      - name: Generate the SBOM
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: '"$RUNNER_TEMP/syft" scan "registry:$IMAGE@$DIGEST" --output "spdx-json=$RUNNER_TEMP/sbom.spdx.json"'
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
    if: ${{ github.event_name == 'push' }}

  # A release tags the image with its version and attaches the SBOM and digest.
  release-assets:
    name: Attach the release assets
    needs:
      - release-please
      - build
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Tag the image with the version
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
      - name: Install Syft 1.55.0
        env:
          URL: https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/syft.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" --directory "$RUNNER_TEMP" syft
      - name: Attach the SBOM and image digest to the release
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/syft" scan "registry:$IMAGE@$DIGEST" --output "spdx-json=$RUNNER_TEMP/sbom.spdx.json"
          echo "$IMAGE@$DIGEST" > "$RUNNER_TEMP/image-digest.txt"
          gh release upload "$TAG" "$RUNNER_TEMP/sbom.spdx.json" "$RUNNER_TEMP/image-digest.txt" --repo "$GITHUB_REPOSITORY" --clobber

  deploy-staging:
    name: Deploy to staging
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Apply the alembic migrations to the staging database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret::Add the DATABASE_URL secret to the staging environment (Settings > Environments > staging), so its database is migrated before the new code goes live. If the app applies its own migrations, set database.migrations to none in hollow.yml."
            exit 1
          fi
          uv run --no-sync alembic upgrade head
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Point the staging tag at this image
        id: promote
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG_NAME: staging
        run: |
          previous="$(docker buildx imagetools inspect "$IMAGE:$TAG_NAME" --format '{{json .Manifest}}' 2> /dev/null | jq --raw-output '.digest // empty' || true)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create --tag "$IMAGE:$TAG_NAME" "$IMAGE@$DIGEST"
          echo "Deployed $IMAGE@$DIGEST as $TAG_NAME" >> "$GITHUB_STEP_SUMMARY"
    if: ${{ github.event_name == 'push' }}

  # Production deploys automatically only when its environment has required reviewers. Otherwise the release waits for a manual run.
  production-gate:
    name: Check the production approval
    needs:
      - release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      reviewed: ${{ steps.check.outputs.reviewed }}
    steps:
      - name: Look for required reviewers on production
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          reviewers="$(gh api "repos/$GITHUB_REPOSITORY/environments/production" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2> /dev/null || echo 0)"
          if [ "$reviewers" -gt 0 ]; then
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
            echo "Production waits for its required reviewers." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "reviewed=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Production needs a manual approval"
            echo "The production environment has no required reviewers (GitHub offers them on private repos only with Enterprise), so $TAG was not deployed automatically."
            echo "To approve it, someone with write access runs the Release workflow with version $TAG, from the Actions tab or with:"
            echo '```'
            echo "gh workflow run release.yml -f version=$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Production not deployed::Run the Release workflow with version $TAG to deploy it to production."

  # Waits for the production environment's approval, then promotes the same digest.
  deploy-production:
    name: Deploy to production
    needs:
      - release-please
      - build
      - release-assets
      - deploy-staging
      - production-gate
    if: ${{ needs.release-please.outputs.released == 'true' && needs.production-gate.outputs.reviewed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Apply the alembic migrations to the production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret::Add the DATABASE_URL secret to the production environment (Settings > Environments > production), so its database is migrated before the new code goes live. If the app applies its own migrations, set database.migrations to none in hollow.yml."
            exit 1
          fi
          uv run --no-sync alembic upgrade head
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Point the production tag at this image
        id: promote
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG_NAME: production
        run: |
          previous="$(docker buildx imagetools inspect "$IMAGE:$TAG_NAME" --format '{{json .Manifest}}' 2> /dev/null | jq --raw-output '.digest // empty' || true)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create --tag "$IMAGE:$TAG_NAME" "$IMAGE@$DIGEST"
          echo "Deployed $IMAGE@$DIGEST as $TAG_NAME" >> "$GITHUB_STEP_SUMMARY"

  # A person with write access runs this workflow with a release version: that run is the approval, and it deploys the release's own artifact.
  deploy-production-manual:
    name: Deploy a release to production (manual approval)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Find the release to deploy
        id: release
        env:
          INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$INPUT" in
            '' | *[!A-Za-z0-9._-]*)
              echo "::error title=Version::Enter a release version such as v1.4.0."
              exit 1
              ;;
          esac
          tag="$INPUT"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then tag="v$INPUT"; fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error title=Version::There is no release $INPUT."
            exit 1
          fi
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          ref="$(cat "$assets/image-digest.txt" 2> /dev/null || true)"
          if ! echo "$ref" | grep -Eqx 'ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}'; then
            echo "::error title=Release assets::$tag has no valid image-digest.txt, so there is nothing to deploy."
            exit 1
          fi
          echo "image=$(echo "$ref" | cut -d@ -f1)" >> "$GITHUB_OUTPUT"
          echo "digest=$(echo "$ref" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          echo "Deploying release $tag to production, approved by $GITHUB_ACTOR running this workflow." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Apply the alembic migrations to the production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret::Add the DATABASE_URL secret to the production environment (Settings > Environments > production), so its database is migrated before the new code goes live. If the app applies its own migrations, set database.migrations to none in hollow.yml."
            exit 1
          fi
          uv run --no-sync alembic upgrade head
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Point the production tag at this image
        id: promote
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.release.outputs.digest }}
          TAG_NAME: production
        run: |
          previous="$(docker buildx imagetools inspect "$IMAGE:$TAG_NAME" --format '{{json .Manifest}}' 2> /dev/null | jq --raw-output '.digest // empty' || true)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create --tag "$IMAGE:$TAG_NAME" "$IMAGE@$DIGEST"
          echo "Deployed $IMAGE@$DIGEST as $TAG_NAME" >> "$GITHUB_STEP_SUMMARY"

  # A failed production deploy opens an incident issue (label hollow-incident); the next successful one closes it.
  report-production:
    name: Report the production deploy
    needs:
      - release-please
      - deploy-production
      - deploy-production-manual
    if: ${{ always() && (needs.deploy-production.result == 'success' || needs.deploy-production.result == 'failure' || needs.deploy-production-manual.result == 'success' || needs.deploy-production-manual.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the incident
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Production deploy failed
          FAILING: ${{ needs.deploy-production.result == 'failure' || needs.deploy-production-manual.result == 'failure' }}
          DETAIL: The production deploy of ${{ needs.release-please.outputs.tag || inputs.version }} failed. If its health check failed, production was rolled back to the version it ran before; the run's log says which step failed and whether the rollback worked.
          ISSUES: "true"
          SLACK_WEBHOOK: ""
          DISCORD_WEBHOOK: ""
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          now="$(date -u '+%Y-%m-%d %H:%M UTC')"
          notify() {
            if [ -n "$SLACK_WEBHOOK" ]; then
              jq --null-input --arg text "$1" '{text: $text}' | curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data @- "$SLACK_WEBHOOK" > /dev/null || echo '::warning title=Alert::The Slack webhook did not accept the message.'
            fi
            if [ -n "$DISCORD_WEBHOOK" ]; then
              jq --null-input --arg text "$1" '{content: $text}' | curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data @- "$DISCORD_WEBHOOK" > /dev/null || echo '::warning title=Alert::The Discord webhook did not accept the message.'
            fi
          }
          number=""
          if [ "$ISSUES" = "true" ]; then
            gh label create hollow-incident --repo "$GITHUB_REPOSITORY" --color B60205 --description "Opened by The Hollow when a check or deploy fails" --force > /dev/null 2>&1 || true
            number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label hollow-incident --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          fi
          if [ "$FAILING" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still failing at $now: $run_url" > /dev/null
              exit 0
            fi
            if [ "$ISSUES" = "true" ]; then
              printf '%s\n\nFirst failed at %s: %s\n\nThe Hollow closes this issue when it passes again.\n' "$DETAIL" "$now" "$run_url" |
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label hollow-incident --body-file - > /dev/null
            fi
            notify "$TITLE. $run_url"
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Passing again at $now: $run_url" > /dev/null
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" > /dev/null
            notify "Recovered: $TITLE. $run_url"
          fi
