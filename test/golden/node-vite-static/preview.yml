# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# A Cloudflare Pages preview for each pull request from a branch in this repo, using the preview environment's variables.

name: Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

# A new push replaces the preview that was still building.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview deploy
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install wrangler 4.156.0
        env:
          URL: https://registry.npmjs.org/wrangler/-/wrangler-4.156.0.tgz
          SHA512: 9152c04a1b8b88d804de372b9977329837ff88f2833eb4b10027b9b9eba05bfdf71de341f44f4290a61c86e742781c209ac9e5e24fb5cede0d3bbbea6ff7d1b9
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/wrangler.tgz" "$URL"
          echo "$SHA512  $RUNNER_TEMP/wrangler.tgz" | sha512sum --check --strict
          npm install --global --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/wrangler.tgz"
      - name: Confirm the Cloudflare token and account ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing secret::Add a Cloudflare API token as the CLOUDFLARE_API_TOKEN secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing variable::Add your Cloudflare account ID as the CLOUDFLARE_ACCOUNT_ID variable."
            exit 1
          fi
      - name: Build
        run: pnpm run build
      - name: Deploy to a preview branch
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: fixture-vite-static
          OUTPUT_DIR: dist
          PR: ${{ github.event.pull_request.number }}
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler.ndjson"
          wrangler pages deploy "$OUTPUT_DIR" --project-name "$PROJECT" --branch "pr-$PR" --commit-hash "$GITHUB_SHA"
          entry="$(jq --compact-output 'select(.type == "pages-deploy-detailed")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          url="$(echo "$entry" | jq --raw-output '.alias // .url // empty')"
          environment="$(echo "$entry" | jq --raw-output '.environment // empty')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "Deployed to $environment: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Post the preview URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          MARKER: <!-- hollow-preview -->
        run: |
          body="$(printf '%s\n\nPreview of %s: %s' "$MARKER" "$SHA" "$URL")"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
