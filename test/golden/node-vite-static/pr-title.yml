# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# Pull request titles become commit messages on merge, and releases are versioned from them.

name: PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

# Reads only the event payload, so it needs no token permissions.
permissions: {}

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PATTERN: "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([A-Za-z0-9._/-]+\\))?!?: [^ ].*$"
        run: |
          if printf '%s' "$TITLE" | grep --quiet --extended-regexp "$PATTERN"; then
            echo "Title OK: $TITLE"
          else
            echo "::error title=PR title::Start the title with a Conventional Commit type, for example \"feat: add login\" or \"fix(api): handle timeouts\". Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          fi
