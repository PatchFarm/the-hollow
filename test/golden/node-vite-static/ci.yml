# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# Runs on every pull request and every push to the default branch.
# Every action is pinned to a commit SHA and every downloaded tool is checked against its checksum.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm exec prettier --check .
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: "Test (placeholder: no tests found)"
        run: echo "::warning title=No tests::The Hollow found no test runner in this project. Add tests, then run hollow upgrade."
      - name: Build
        run: pnpm run build

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks 8.30.1
        env:
          URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan the git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  dependencies:
    name: Dependency scan (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner 2.7.0
        env:
          URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/osv-scanner" "$URL"
          echo "$SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Fail on high or worse
        env:
          MIN_CVSS: "7.0"
          UNKNOWN_BLOCKS: "0"
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --format json --output "$RUNNER_TEMP/osv.json" .
          code=$?
          set -e
          if [ "$code" -eq 128 ]; then
            echo "::warning title=OSV-Scanner::No lockfiles or manifests found to scan."
            exit 0
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error title=OSV-Scanner::The scan itself failed (exit code $code)."
            exit "$code"
          fi
          jq --raw-output '.results[]?.packages[]? as $p | $p.groups[]? | [$p.package.ecosystem, ($p.package.name + "@" + $p.package.version), (.ids | join(",")), (if (.max_severity // "") == "" then "unknown" else .max_severity end)] | @tsv' "$RUNNER_TEMP/osv.json" > "$RUNNER_TEMP/findings.tsv"
          if [ ! -s "$RUNNER_TEMP/findings.tsv" ]; then
            echo "No known vulnerabilities in dependencies."
            exit 0
          fi
          awk -F '\t' -v min="$MIN_CVSS" -v unknown_blocks="$UNKNOWN_BLOCKS" '
            {
              blocking = ($4 == "unknown") ? (unknown_blocks == 1) : ($4 + 0 >= min + 0)
              level = blocking ? "error" : "warning"
              printf "::%s title=Vulnerable dependency::%s %s (%s), CVSS %s\n", level, $1, $2, $3, $4
              if (blocking) failed = 1
            }
            END { exit failed }
          ' "$RUNNER_TEMP/findings.tsv"

  # CodeQL is free on public repositories.
  codeql:
    name: SAST (CodeQL)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, actions
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  # Private repositories need GitHub Advanced Security for CodeQL, so they get Semgrep instead.
  semgrep:
    name: SAST (Semgrep)
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 # 1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on high or worse
        run: semgrep scan --config p/default --metrics off --error --severity ERROR

  # One stable check name to require in branch protection, whatever jobs run above.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs:
      - build
      - secrets
      - dependencies
      - codeql
      - semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail unless every job succeeded or was skipped on purpose
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          bad=$(echo "$RESULTS" | tr ' ' '\n' | grep --invert-match --extended-regexp '^(success|skipped)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::A required job did not succeed: $bad"
            exit 1
          fi
