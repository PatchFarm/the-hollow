# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# Merging the release pull request tags a version and publishes one artifact with an SBOM and provenance.

name: Release

on:
  push:
    branches:
      - main

permissions: {}

# Releases run one at a time and are never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Uses the RELEASE_PLEASE_TOKEN secret when set, so release pull requests run CI; otherwise the workflow token.
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  artifact:
    name: Publish the release archive
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Package the source at the tag
        id: package
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          OUTPUT_DIR: ""
        run: |
          name="$(basename "$GITHUB_REPOSITORY")-$VERSION"
          file="$RUNNER_TEMP/$name.tar.gz"
          git archive --format=tar.gz --prefix="$name/" --output "$file" HEAD
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Install Syft 1.55.0
        env:
          URL: https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/syft.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" --directory "$RUNNER_TEMP" syft
      - name: Generate the SBOM
        run: '"$RUNNER_TEMP/syft" scan dir:. --output "spdx-json=$RUNNER_TEMP/sbom.spdx.json"'
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
      - name: Attach the archive and SBOM to the release
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.package.outputs.file }}
        run: gh release upload "$TAG" "$FILE" "$RUNNER_TEMP/sbom.spdx.json" --repo "$GITHUB_REPOSITORY" --clobber
