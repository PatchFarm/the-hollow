# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# Every merge deploys to staging. Merging the release pull request promotes that same image to production.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release to deploy to production, for example v1.4.0. Running this is the approval.
        required: true
        type: string

permissions: {}

jobs:
  # Uses the RELEASE_PLEASE_TOKEN secret when set, so release pull requests run CI; otherwise the workflow token.
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
    if: ${{ github.event_name == 'push' }}

  # Every merge builds the image once. Every environment runs this exact digest.
  build:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image
        id: image
        env:
          DOCKERFILE: Dockerfile
          IMAGE_NAME: ""
        run: |
          name="$IMAGE_NAME"
          if [ -z "$name" ]; then name="$GITHUB_REPOSITORY"; fi
          image="ghcr.io/$(echo "$name" | tr '[:upper:]' '[:lower:]')"
          docker build --file "$DOCKERFILE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" .
          docker push "$image:sha-$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:sha-$GITHUB_SHA" | cut -d@ -f2)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Built $image@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Syft 1.55.0
        env:
          URL: https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/syft.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" --directory "$RUNNER_TEMP" syft
      - name: Generate the SBOM
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: '"$RUNNER_TEMP/syft" scan "registry:$IMAGE@$DIGEST" --output "spdx-json=$RUNNER_TEMP/sbom.spdx.json"'
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
    if: ${{ github.event_name == 'push' }}

  # A release tags the image with its version and attaches the SBOM and digest.
  release-assets:
    name: Attach the release assets
    needs:
      - release-please
      - build
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Tag the image with the version
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
      - name: Install Syft 1.55.0
        env:
          URL: https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/syft.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" --directory "$RUNNER_TEMP" syft
      - name: Attach the SBOM and image digest to the release
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/syft" scan "registry:$IMAGE@$DIGEST" --output "spdx-json=$RUNNER_TEMP/sbom.spdx.json"
          echo "$IMAGE@$DIGEST" > "$RUNNER_TEMP/image-digest.txt"
          gh release upload "$TAG" "$RUNNER_TEMP/sbom.spdx.json" "$RUNNER_TEMP/image-digest.txt" --repo "$GITHUB_REPOSITORY" --clobber

  deploy-staging:
    name: Deploy to staging
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error title=Missing secret::Add the VPS_SSH_KEY secret to the staging environment (Settings > Environments > staging)."
            exit 1
          fi
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error title=Missing variable::Add the VPS_KNOWN_HOSTS variable to the staging environment, set to the output of: ssh-keyscan -p 22 app.example.com"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Deploy to app.example.com
        id: deploy
        env:
          HOST: app.example.com
          SSH_USER: deploy
          SSH_PORT: "22"
          DIR: /srv/app/staging
          ENVIRONMENT: staging
          IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          APP_PORT: ${{ vars.APP_PORT || '8001' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$APP_PORT" in
            '' | *[!0-9]*)
              echo "::error title=APP_PORT::The APP_PORT variable must be a port number, not '$APP_PORT'."
              exit 1
              ;;
          esac
          remote() {
            ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT" "$SSH_USER@$HOST" "$@"
          }
          project="$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')-$ENVIRONMENT"
          remote mkdir -p -- "$DIR"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$SSH_PORT" \
            deploy/compose.yaml "$SSH_USER@$HOST:$DIR/compose.yaml"
          echo "$GH_TOKEN" | remote docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'remote docker logout ghcr.io > /dev/null || true' EXIT
          remote sh -s -- "$DIR" "$IMAGE_REF" "$project" "$APP_PORT" << 'REMOTE'
          set -eu
          cd "$1"
          project="$3"
          compose() {
            if [ -f .env ]; then
              docker compose --project-name "$project" --env-file .env --env-file .hollow.env "$@"
            else
              docker compose --project-name "$project" --env-file .hollow.env "$@"
            fi
          }
          if [ -f .hollow.env ]; then cp .hollow.env .hollow.env.previous; fi
          printf 'IMAGE=%s\nAPP_PORT=%s\n' "$2" "$4" > .hollow.env
          compose pull --quiet
          keep_previous() {
            if [ -f .hollow.env.previous ]; then cp .hollow.env.previous .hollow.env; else rm -f .hollow.env; fi
          }
          mkdir -p backups
          chmod 700 backups
          cat > .hollow-backup.yaml << 'YAML'
          services:
            hollow-backup:
              image: postgres@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
              profiles: [hollow-backup]
              env_file:
                - path: .env
                  required: false
              volumes:
                - ./backups:/backups
                - ./.hollow-backup.sh:/hollow-backup.sh:ro
              entrypoint: ["sh", "/hollow-backup.sh"]
          YAML
          cat > .hollow-backup.sh << 'SCRIPT'
          set -eu
          umask 077
          url="$(printenv DATABASE_URL || true)"
          if [ -z "$url" ]; then
            echo "DATABASE_URL is not set in this environment's .env, so there is nothing to back up." >&2
            exit 1
          fi
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          ssl="$(printf '%s' "$url" | sed -nE 's/.*[?&](sslmode=[a-z-]+).*/\1/p')"
          url="$(printf '%s' "$url" | sed -E 's#^postgres(ql)?(\+[A-Za-z0-9_]+)?://#postgresql://#; s#\?.*$##')"
          if [ -n "$ssl" ]; then url="$url?$ssl"; fi
          file="/backups/$stamp.dump"
          trap 'rm -f -- "$file.partial"' EXIT
          pg_dump --format=custom --no-owner --dbname="$url" --file="$file.partial"
          mv -- "$file.partial" "$file"
          echo "Backed up the database to backups/$(basename "$file")."
          ls -1t /backups/*.dump | tail -n +8 | while IFS= read -r old; do rm -f -- "$old"; done
          SCRIPT
          if compose --file compose.yaml --file .hollow-backup.yaml --profile hollow-backup run --rm -T --user "$(id -u):$(id -g)" hollow-backup < /dev/null; then
            :
          elif [ -f .hollow.env.previous ]; then
            keep_previous
            echo "The database backup failed, so nothing was migrated or deployed." >&2
            exit 1
          else
            echo "The database backup failed. This is the first deploy, so it goes ahead without one." >&2
          fi
          if ! compose run --rm -T app python manage.py migrate --noinput < /dev/null; then
            keep_previous
            echo "The django migrations failed, so the new version was not started and the previous one keeps running. The backup from just before is in backups/." >&2
            exit 1
          fi
          if compose up --detach --wait --wait-timeout 120; then
            echo "The new version is up and healthy."
            exit 0
          fi
          echo "The new version did not become healthy." >&2
          if [ -f .hollow.env.previous ]; then
            cp .hollow.env.previous .hollow.env
            compose up --detach --wait --wait-timeout 120 || true
            echo "Rolled back to the previous version. The database stays migrated: a rollback restores the previous code, not the schema." >&2
          fi
          exit 1
          REMOTE
          echo "Deployed $IMAGE_REF to $ENVIRONMENT on $HOST" >> "$GITHUB_STEP_SUMMARY"
    if: ${{ github.event_name == 'push' }}

  # Production deploys automatically only when its environment has required reviewers. Otherwise the release waits for a manual run.
  production-gate:
    name: Check the production approval
    needs:
      - release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      reviewed: ${{ steps.check.outputs.reviewed }}
    steps:
      - name: Look for required reviewers on production
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          reviewers="$(gh api "repos/$GITHUB_REPOSITORY/environments/production" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2> /dev/null || echo 0)"
          if [ "$reviewers" -gt 0 ]; then
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
            echo "Production waits for its required reviewers." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "reviewed=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Production needs a manual approval"
            echo "The production environment has no required reviewers (GitHub offers them on private repos only with Enterprise), so $TAG was not deployed automatically."
            echo "To approve it, someone with write access runs the Release workflow with version $TAG, from the Actions tab or with:"
            echo '```'
            echo "gh workflow run release.yml -f version=$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Production not deployed::Run the Release workflow with version $TAG to deploy it to production."

  # Waits for the production environment's approval, then promotes the same digest.
  deploy-production:
    name: Deploy to production
    needs:
      - release-please
      - build
      - release-assets
      - deploy-staging
      - production-gate
    if: ${{ needs.release-please.outputs.released == 'true' && needs.production-gate.outputs.reviewed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error title=Missing secret::Add the VPS_SSH_KEY secret to the production environment (Settings > Environments > production)."
            exit 1
          fi
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error title=Missing variable::Add the VPS_KNOWN_HOSTS variable to the production environment, set to the output of: ssh-keyscan -p 22 app.example.com"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Deploy to app.example.com
        id: deploy
        env:
          HOST: app.example.com
          SSH_USER: deploy
          SSH_PORT: "22"
          DIR: /srv/app/production
          ENVIRONMENT: production
          IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          APP_PORT: ${{ vars.APP_PORT || '8000' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$APP_PORT" in
            '' | *[!0-9]*)
              echo "::error title=APP_PORT::The APP_PORT variable must be a port number, not '$APP_PORT'."
              exit 1
              ;;
          esac
          remote() {
            ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT" "$SSH_USER@$HOST" "$@"
          }
          project="$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')-$ENVIRONMENT"
          remote mkdir -p -- "$DIR"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$SSH_PORT" \
            deploy/compose.yaml "$SSH_USER@$HOST:$DIR/compose.yaml"
          echo "$GH_TOKEN" | remote docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'remote docker logout ghcr.io > /dev/null || true' EXIT
          remote sh -s -- "$DIR" "$IMAGE_REF" "$project" "$APP_PORT" << 'REMOTE'
          set -eu
          cd "$1"
          project="$3"
          compose() {
            if [ -f .env ]; then
              docker compose --project-name "$project" --env-file .env --env-file .hollow.env "$@"
            else
              docker compose --project-name "$project" --env-file .hollow.env "$@"
            fi
          }
          if [ -f .hollow.env ]; then cp .hollow.env .hollow.env.previous; fi
          printf 'IMAGE=%s\nAPP_PORT=%s\n' "$2" "$4" > .hollow.env
          compose pull --quiet
          keep_previous() {
            if [ -f .hollow.env.previous ]; then cp .hollow.env.previous .hollow.env; else rm -f .hollow.env; fi
          }
          mkdir -p backups
          chmod 700 backups
          cat > .hollow-backup.yaml << 'YAML'
          services:
            hollow-backup:
              image: postgres@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
              profiles: [hollow-backup]
              env_file:
                - path: .env
                  required: false
              volumes:
                - ./backups:/backups
                - ./.hollow-backup.sh:/hollow-backup.sh:ro
              entrypoint: ["sh", "/hollow-backup.sh"]
          YAML
          cat > .hollow-backup.sh << 'SCRIPT'
          set -eu
          umask 077
          url="$(printenv DATABASE_URL || true)"
          if [ -z "$url" ]; then
            echo "DATABASE_URL is not set in this environment's .env, so there is nothing to back up." >&2
            exit 1
          fi
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          ssl="$(printf '%s' "$url" | sed -nE 's/.*[?&](sslmode=[a-z-]+).*/\1/p')"
          url="$(printf '%s' "$url" | sed -E 's#^postgres(ql)?(\+[A-Za-z0-9_]+)?://#postgresql://#; s#\?.*$##')"
          if [ -n "$ssl" ]; then url="$url?$ssl"; fi
          file="/backups/$stamp.dump"
          trap 'rm -f -- "$file.partial"' EXIT
          pg_dump --format=custom --no-owner --dbname="$url" --file="$file.partial"
          mv -- "$file.partial" "$file"
          echo "Backed up the database to backups/$(basename "$file")."
          ls -1t /backups/*.dump | tail -n +8 | while IFS= read -r old; do rm -f -- "$old"; done
          SCRIPT
          if compose --file compose.yaml --file .hollow-backup.yaml --profile hollow-backup run --rm -T --user "$(id -u):$(id -g)" hollow-backup < /dev/null; then
            :
          elif [ -f .hollow.env.previous ]; then
            keep_previous
            echo "The database backup failed, so nothing was migrated or deployed." >&2
            exit 1
          else
            echo "The database backup failed. This is the first deploy, so it goes ahead without one." >&2
          fi
          if ! compose run --rm -T app python manage.py migrate --noinput < /dev/null; then
            keep_previous
            echo "The django migrations failed, so the new version was not started and the previous one keeps running. The backup from just before is in backups/." >&2
            exit 1
          fi
          if compose up --detach --wait --wait-timeout 120; then
            echo "The new version is up and healthy."
            exit 0
          fi
          echo "The new version did not become healthy." >&2
          if [ -f .hollow.env.previous ]; then
            cp .hollow.env.previous .hollow.env
            compose up --detach --wait --wait-timeout 120 || true
            echo "Rolled back to the previous version. The database stays migrated: a rollback restores the previous code, not the schema." >&2
          fi
          exit 1
          REMOTE
          echo "Deployed $IMAGE_REF to $ENVIRONMENT on $HOST" >> "$GITHUB_STEP_SUMMARY"

  # A person with write access runs this workflow with a release version: that run is the approval, and it deploys the release's own artifact.
  deploy-production-manual:
    name: Deploy a release to production (manual approval)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Find the release to deploy
        id: release
        env:
          INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$INPUT" in
            '' | *[!A-Za-z0-9._-]*)
              echo "::error title=Version::Enter a release version such as v1.4.0."
              exit 1
              ;;
          esac
          tag="$INPUT"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then tag="v$INPUT"; fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error title=Version::There is no release $INPUT."
            exit 1
          fi
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          ref="$(cat "$assets/image-digest.txt" 2> /dev/null || true)"
          if ! echo "$ref" | grep -Eqx 'ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}'; then
            echo "::error title=Release assets::$tag has no valid image-digest.txt, so there is nothing to deploy."
            exit 1
          fi
          echo "image=$(echo "$ref" | cut -d@ -f1)" >> "$GITHUB_OUTPUT"
          echo "digest=$(echo "$ref" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          echo "Deploying release $tag to production, approved by $GITHUB_ACTOR running this workflow." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error title=Missing secret::Add the VPS_SSH_KEY secret to the production environment (Settings > Environments > production)."
            exit 1
          fi
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error title=Missing variable::Add the VPS_KNOWN_HOSTS variable to the production environment, set to the output of: ssh-keyscan -p 22 app.example.com"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Deploy to app.example.com
        id: deploy
        env:
          HOST: app.example.com
          SSH_USER: deploy
          SSH_PORT: "22"
          DIR: /srv/app/production
          ENVIRONMENT: production
          IMAGE_REF: ${{ steps.release.outputs.image }}@${{ steps.release.outputs.digest }}
          APP_PORT: ${{ vars.APP_PORT || '8000' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$APP_PORT" in
            '' | *[!0-9]*)
              echo "::error title=APP_PORT::The APP_PORT variable must be a port number, not '$APP_PORT'."
              exit 1
              ;;
          esac
          remote() {
            ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT" "$SSH_USER@$HOST" "$@"
          }
          project="$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')-$ENVIRONMENT"
          remote mkdir -p -- "$DIR"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$SSH_PORT" \
            deploy/compose.yaml "$SSH_USER@$HOST:$DIR/compose.yaml"
          echo "$GH_TOKEN" | remote docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'remote docker logout ghcr.io > /dev/null || true' EXIT
          remote sh -s -- "$DIR" "$IMAGE_REF" "$project" "$APP_PORT" << 'REMOTE'
          set -eu
          cd "$1"
          project="$3"
          compose() {
            if [ -f .env ]; then
              docker compose --project-name "$project" --env-file .env --env-file .hollow.env "$@"
            else
              docker compose --project-name "$project" --env-file .hollow.env "$@"
            fi
          }
          if [ -f .hollow.env ]; then cp .hollow.env .hollow.env.previous; fi
          printf 'IMAGE=%s\nAPP_PORT=%s\n' "$2" "$4" > .hollow.env
          compose pull --quiet
          keep_previous() {
            if [ -f .hollow.env.previous ]; then cp .hollow.env.previous .hollow.env; else rm -f .hollow.env; fi
          }
          mkdir -p backups
          chmod 700 backups
          cat > .hollow-backup.yaml << 'YAML'
          services:
            hollow-backup:
              image: postgres@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
              profiles: [hollow-backup]
              env_file:
                - path: .env
                  required: false
              volumes:
                - ./backups:/backups
                - ./.hollow-backup.sh:/hollow-backup.sh:ro
              entrypoint: ["sh", "/hollow-backup.sh"]
          YAML
          cat > .hollow-backup.sh << 'SCRIPT'
          set -eu
          umask 077
          url="$(printenv DATABASE_URL || true)"
          if [ -z "$url" ]; then
            echo "DATABASE_URL is not set in this environment's .env, so there is nothing to back up." >&2
            exit 1
          fi
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          ssl="$(printf '%s' "$url" | sed -nE 's/.*[?&](sslmode=[a-z-]+).*/\1/p')"
          url="$(printf '%s' "$url" | sed -E 's#^postgres(ql)?(\+[A-Za-z0-9_]+)?://#postgresql://#; s#\?.*$##')"
          if [ -n "$ssl" ]; then url="$url?$ssl"; fi
          file="/backups/$stamp.dump"
          trap 'rm -f -- "$file.partial"' EXIT
          pg_dump --format=custom --no-owner --dbname="$url" --file="$file.partial"
          mv -- "$file.partial" "$file"
          echo "Backed up the database to backups/$(basename "$file")."
          ls -1t /backups/*.dump | tail -n +8 | while IFS= read -r old; do rm -f -- "$old"; done
          SCRIPT
          if compose --file compose.yaml --file .hollow-backup.yaml --profile hollow-backup run --rm -T --user "$(id -u):$(id -g)" hollow-backup < /dev/null; then
            :
          elif [ -f .hollow.env.previous ]; then
            keep_previous
            echo "The database backup failed, so nothing was migrated or deployed." >&2
            exit 1
          else
            echo "The database backup failed. This is the first deploy, so it goes ahead without one." >&2
          fi
          if ! compose run --rm -T app python manage.py migrate --noinput < /dev/null; then
            keep_previous
            echo "The django migrations failed, so the new version was not started and the previous one keeps running. The backup from just before is in backups/." >&2
            exit 1
          fi
          if compose up --detach --wait --wait-timeout 120; then
            echo "The new version is up and healthy."
            exit 0
          fi
          echo "The new version did not become healthy." >&2
          if [ -f .hollow.env.previous ]; then
            cp .hollow.env.previous .hollow.env
            compose up --detach --wait --wait-timeout 120 || true
            echo "Rolled back to the previous version. The database stays migrated: a rollback restores the previous code, not the schema." >&2
          fi
          exit 1
          REMOTE
          echo "Deployed $IMAGE_REF to $ENVIRONMENT on $HOST" >> "$GITHUB_STEP_SUMMARY"
