# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# Scheduled checks. Each failure opens one incident issue (label hollow-incident), closed again when it passes.

name: Scheduled

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: 23 3 * * *
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: scheduled
  cancel-in-progress: false

jobs:
  # Every 15 minutes, at best: GitHub delays scheduled runs when it is busy.
  synthetic:
    name: Synthetic checks
    if: ${{ github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Check staging (https://staging.example.com/)
        id: check-staging
        continue-on-error: true
        env:
          URL: https://staging.example.com/
        run: |
          for attempt in 1 2 3; do
            code="$(curl --silent --location --max-time 10 --output /dev/null --write-out '%{http_code}' "$URL" || true)"
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "$URL answered $code."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error title=Synthetic check::$URL did not answer without a server error (last status: $code)."
          exit 1
      - name: Report staging
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: staging is not answering (https://staging.example.com/)
          FAILING: ${{ steps.check-staging.outcome == 'failure' }}
          DETAIL: The scheduled check of https://staging.example.com/ got no answer without a server error, three times in a row. Look at the app's logs on the target, or run the Release workflow again to redeploy.
          ISSUES: "true"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ""
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          now="$(date -u '+%Y-%m-%d %H:%M UTC')"
          notify() {
            if [ -n "$SLACK_WEBHOOK" ]; then
              jq --null-input --arg text "$1" '{text: $text}' | curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data @- "$SLACK_WEBHOOK" > /dev/null || echo '::warning title=Alert::The Slack webhook did not accept the message.'
            fi
            if [ -n "$DISCORD_WEBHOOK" ]; then
              jq --null-input --arg text "$1" '{content: $text}' | curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data @- "$DISCORD_WEBHOOK" > /dev/null || echo '::warning title=Alert::The Discord webhook did not accept the message.'
            fi
          }
          number=""
          if [ "$ISSUES" = "true" ]; then
            gh label create hollow-incident --repo "$GITHUB_REPOSITORY" --color B60205 --description "Opened by The Hollow when a check or deploy fails" --force > /dev/null 2>&1 || true
            number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label hollow-incident --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          fi
          if [ "$FAILING" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still failing at $now: $run_url" > /dev/null
              exit 0
            fi
            if [ "$ISSUES" = "true" ]; then
              printf '%s\n\nFirst failed at %s: %s\n\nThe Hollow closes this issue when it passes again.\n' "$DETAIL" "$now" "$run_url" |
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label hollow-incident --body-file - > /dev/null
            fi
            notify "$TITLE. $run_url"
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Passing again at $now: $run_url" > /dev/null
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" > /dev/null
            notify "Recovered: $TITLE. $run_url"
          fi
      - name: Check production (https://example.com/)
        id: check-production
        continue-on-error: true
        env:
          URL: https://example.com/
        run: |
          for attempt in 1 2 3; do
            code="$(curl --silent --location --max-time 10 --output /dev/null --write-out '%{http_code}' "$URL" || true)"
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "$URL answered $code."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error title=Synthetic check::$URL did not answer without a server error (last status: $code)."
          exit 1
      - name: Report production
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: production is not answering (https://example.com/)
          FAILING: ${{ steps.check-production.outcome == 'failure' }}
          DETAIL: The scheduled check of https://example.com/ got no answer without a server error, three times in a row. Look at the app's logs on the target, or run the Release workflow again to redeploy.
          ISSUES: "true"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ""
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          now="$(date -u '+%Y-%m-%d %H:%M UTC')"
          notify() {
            if [ -n "$SLACK_WEBHOOK" ]; then
              jq --null-input --arg text "$1" '{text: $text}' | curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data @- "$SLACK_WEBHOOK" > /dev/null || echo '::warning title=Alert::The Slack webhook did not accept the message.'
            fi
            if [ -n "$DISCORD_WEBHOOK" ]; then
              jq --null-input --arg text "$1" '{content: $text}' | curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data @- "$DISCORD_WEBHOOK" > /dev/null || echo '::warning title=Alert::The Discord webhook did not accept the message.'
            fi
          }
          number=""
          if [ "$ISSUES" = "true" ]; then
            gh label create hollow-incident --repo "$GITHUB_REPOSITORY" --color B60205 --description "Opened by The Hollow when a check or deploy fails" --force > /dev/null 2>&1 || true
            number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label hollow-incident --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          fi
          if [ "$FAILING" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still failing at $now: $run_url" > /dev/null
              exit 0
            fi
            if [ "$ISSUES" = "true" ]; then
              printf '%s\n\nFirst failed at %s: %s\n\nThe Hollow closes this issue when it passes again.\n' "$DETAIL" "$now" "$run_url" |
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label hollow-incident --body-file - > /dev/null
            fi
            notify "$TITLE. $run_url"
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Passing again at $now: $run_url" > /dev/null
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" > /dev/null
            notify "Recovered: $TITLE. $run_url"
          fi
      - name: Fail the run if any check failed
        env:
          OUTCOMES: ${{ steps.check-staging.outcome }} ${{ steps.check-production.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            if [ "$outcome" = "failure" ]; then exit 1; fi
          done

  # New vulnerabilities are published every day, so the default branch is re-scanned every night.
  dependencies:
    name: Nightly dependency scan
    if: ${{ github.event.schedule == '23 3 * * *' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner 2.7.0
        env:
          URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/osv-scanner" "$URL"
          echo "$SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Fail on high or worse
        env:
          MIN_CVSS: "7.0"
          UNKNOWN_BLOCKS: "0"
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --format json --output "$RUNNER_TEMP/osv.json" .
          code=$?
          set -e
          if [ "$code" -eq 128 ]; then
            echo "::warning title=OSV-Scanner::No lockfiles or manifests found to scan."
            exit 0
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error title=OSV-Scanner::The scan itself failed (exit code $code)."
            exit "$code"
          fi
          jq --raw-output '.results[]?.packages[]? as $p | $p.groups[]? | [$p.package.ecosystem, ($p.package.name + "@" + $p.package.version), (.ids | join(",")), (if (.max_severity // "") == "" then "unknown" else .max_severity end)] | @tsv' "$RUNNER_TEMP/osv.json" > "$RUNNER_TEMP/findings.tsv"
          if [ ! -s "$RUNNER_TEMP/findings.tsv" ]; then
            echo "No known vulnerabilities in dependencies."
            exit 0
          fi
          awk -F '\t' -v min="$MIN_CVSS" -v unknown_blocks="$UNKNOWN_BLOCKS" '
            {
              blocking = ($4 == "unknown") ? (unknown_blocks == 1) : ($4 + 0 >= min + 0)
              level = blocking ? "error" : "warning"
              printf "::%s title=Vulnerable dependency::%s %s (%s), CVSS %s\n", level, $1, $2, $3, $4
              if (blocking) failed = 1
            }
            END { exit failed }
          ' "$RUNNER_TEMP/findings.tsv"

  dependencies-report:
    name: Report the dependency scan
    needs:
      - dependencies
    if: ${{ always() && needs.dependencies.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the incident
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Nightly dependency scan found vulnerabilities
          FAILING: ${{ needs.dependencies.result == 'failure' }}
          DETAIL: The nightly OSV-Scanner run found dependencies with known vulnerabilities at high or worse. The run's annotations list them; upgrade them, or raise security.failOn in hollow.yml.
          ISSUES: "true"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ""
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          now="$(date -u '+%Y-%m-%d %H:%M UTC')"
          notify() {
            if [ -n "$SLACK_WEBHOOK" ]; then
              jq --null-input --arg text "$1" '{text: $text}' | curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data @- "$SLACK_WEBHOOK" > /dev/null || echo '::warning title=Alert::The Slack webhook did not accept the message.'
            fi
            if [ -n "$DISCORD_WEBHOOK" ]; then
              jq --null-input --arg text "$1" '{content: $text}' | curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data @- "$DISCORD_WEBHOOK" > /dev/null || echo '::warning title=Alert::The Discord webhook did not accept the message.'
            fi
          }
          number=""
          if [ "$ISSUES" = "true" ]; then
            gh label create hollow-incident --repo "$GITHUB_REPOSITORY" --color B60205 --description "Opened by The Hollow when a check or deploy fails" --force > /dev/null 2>&1 || true
            number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label hollow-incident --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          fi
          if [ "$FAILING" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still failing at $now: $run_url" > /dev/null
              exit 0
            fi
            if [ "$ISSUES" = "true" ]; then
              printf '%s\n\nFirst failed at %s: %s\n\nThe Hollow closes this issue when it passes again.\n' "$DETAIL" "$now" "$run_url" |
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label hollow-incident --body-file - > /dev/null
            fi
            notify "$TITLE. $run_url"
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Passing again at $now: $run_url" > /dev/null
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" > /dev/null
            notify "Recovered: $TITLE. $run_url"
          fi
