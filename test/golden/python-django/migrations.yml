# Generated by The Hollow from hollow.yml. Do not edit by hand:
# change hollow.yml, then run `npx the-hollow upgrade`.
# Fails a pull request whose new migrations drop, rename or tighten what running code still uses, unless it has the "allow-destructive-migration" label.

name: Migration safety

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions: {}

# A new push or label change replaces the check that was running.
concurrency:
  group: migrations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check new django migrations for destructive changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-destructive-migration') }}
          LABEL: allow-destructive-migration
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | select(.status != "removed") | .filename' > "$RUNNER_TEMP/changed.txt"
          python3 .github/hollow/check-migrations.py django '*migrations/[0-9]*.py' < "$RUNNER_TEMP/changed.txt"
